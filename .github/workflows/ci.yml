# =============================================================================
# VisiMon — GitHub Actions CI Pipeline
# Runs linting, tests, and builds for every push and PR to main
# =============================================================================

name: VisiMon CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  # ---- Lint Go code ----
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: agent
          args: --timeout=5m

  # ---- Run unit tests ----
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run agent tests
        working-directory: agent
        run: go test ./... -v -count=1 -race

      # NOTE: the server module is built and tested by the dedicated
      # "Server Build & Test" job below, which pins its own Go version. It cannot
      # run here: server/go.mod requires go 1.25 while env.GO_VERSION is 1.22, and
      # this step used to swallow that toolchain error via continue-on-error.
      - name: Check Go mod tidy
        working-directory: agent
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidied"; exit 1)

  # ---- Build & test the server module ----
  # The server has its own Go version requirement (server/go.mod requires
  # go 1.25), so it gets its own job instead of sharing env.GO_VERSION.
  server:
    name: Server Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # keep in sync with the go directive in server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Check gofmt
        working-directory: server
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Go vet
        working-directory: server
        run: go vet ./...

      - name: Go build
        working-directory: server
        run: go build ./...

      - name: Go test
        working-directory: server
        run: go test ./... -count=1

  # ---- Build binaries for all platforms ----
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build agent binary
        working-directory: agent
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o visimon-agent ./cmd/visimon-agent/
          mkdir -p dist
          # github.ref_name is "feat/api-server" on PR branches: the "/" would be
          # read as a directory separator by tar, so sanitize it first.
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          tar -czf "dist/visimon-agent_${SAFE_REF}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" visimon-agent

      - uses: actions/upload-artifact@v4
        with:
          name: visimon-agent_${{ matrix.os }}_${{ matrix.arch }}
          path: agent/dist/visimon-agent_*.tar.gz
          retention-days: 7

  # ---- Build Docker images ----
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build agent Docker image
        run: docker build -f docker/Dockerfile.agent -t visimon/agent:ci .

      - name: Build server Docker image
        run: docker build -f docker/Dockerfile.server -t visimon/server:ci .

      - name: Verify agent image size
        run: |
          SIZE=$(docker images --format '{{.Size}}' visimon/agent:ci)
          echo "Agent image size: $SIZE"
          BYTES=$(echo $SIZE | grep -oP '^[\d.]+' | head -1)
          UNIT=$(echo $SIZE | grep -oP '[A-Za-z]+' | head -1)
          echo "Image size under check: target < 10MB"

  # ---- Frontend lint (if dashboard exists) ----
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        continue-on-error: true
        run: |
          if [ -f "package.json" ]; then
            npm ci --ignore-scripts
            npx eslint src/ --ext .ts,.tsx 2>/dev/null || echo "Lint warnings found"
          else
            echo "No dashboard code yet, skipping"
          fi